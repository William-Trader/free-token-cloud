<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Token Cloud · Relay Console</title>
<style>
  :root{
    --bg:#070a0f; --panel:#0d1219; --panel-2:#111823; --line:#1c2634;
    --ink:#e8eef7; --muted:#8593a6; --dim:#5d6b7d;
    --teal:#2dd4bf; --cyan:#22d3ee; --amber:#fbbf24; --red:#f87171; --green:#34d399;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:
      radial-gradient(900px 500px at 12% -8%, rgba(45,212,191,.13), transparent 60%),
      radial-gradient(700px 420px at 92% 0%, rgba(34,211,238,.10), transparent 55%),
      var(--bg);
    color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1280px;margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
    background:rgba(7,10,15,.78);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:14px;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700}
  .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--cyan));
    display:grid;place-items:center;color:#04231f;font-weight:900;font-size:14px}
  .logo small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.6px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);padding:6px 11px;border-radius:999px;font-size:12px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.14)}
  .dot.bad{background:var(--red);box-shadow:0 0 0 4px rgba(248,113,113,.14)}
  .dot.warn{background:var(--amber);box-shadow:0 0 0 4px rgba(251,191,36,.14)}
  .live .dot.ok{animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    padding:7px 12px;border-radius:10px;font-size:12px}
  .btn:hover{border-color:#2c3a4d}

  main{padding:22px 0 60px}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(5,1fr)}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card h3{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.4px}
  .big{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .big small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .spark{width:100%;height:34px;display:block;margin-top:8px}

  .section{margin-top:22px}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
  .sec-head h2{margin:0;font-size:15px}
  .sec-head .hint{color:var(--dim);font-size:12px}
  .sec-head .spacer{flex:1}

  /* pools */
  .pools{grid-template-columns:1fr 1fr}
  .pool-card{position:relative;overflow:hidden}
  .pool-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--green),transparent)}
  .pool-card.chat::before{background:linear-gradient(90deg,var(--cyan),transparent)}
  .pool-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pool-title{font-size:13px;letter-spacing:.6px;color:var(--muted)}
  .pool-name{font-size:18px;font-weight:700}
  .pool-badge{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid #1f5c4d;color:#a7f3d0;background:rgba(52,211,153,.08)}
  .pool-card.chat .pool-badge{border-color:#1e4b63;color:#bae6fd;background:rgba(34,211,238,.08)}
  .pool-body{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
  .gauge{position:relative;width:96px;height:96px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .gauge .val b{display:block;font-size:18px;letter-spacing:-.3px}
  .gauge .val span{font-size:10px;color:var(--dim)}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .kv div{min-width:0}
  .kv span{display:block;font-size:11px;color:var(--dim)}
  .kv b{font-size:14px;font-weight:600}
  .route{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .route b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .route .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
  .members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .member{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);
    border:1px solid var(--line);border-radius:8px;padding:3px 7px;background:var(--panel-2)}
  .member .dot{width:6px;height:6px}
  .member.hot{color:var(--ink);border-color:#2a3b4d}

  /* usage */
  .usage{grid-template-columns:1.4fr .6fr}
  .chart-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
  #usageChart{width:100%;height:160px;display:block}
  .api-split{display:flex;flex-direction:column;gap:10px}
  .api-row{display:flex;align-items:center;gap:10px}
  .api-row .bar{flex:1;height:8px;border-radius:5px;background:#151d29;overflow:hidden}
  .api-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal))}
  .api-row .n{font-size:12px;color:var(--muted);min-width:78px;text-align:right}
  .top-list{margin-top:6px}
  .top-item{display:grid;grid-template-columns:120px 1fr 46px;gap:10px;align-items:center;padding:4px 0;font-size:12px}
  .top-item .bar{height:7px;border-radius:4px;background:#151d29;overflow:hidden}
  .top-item .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}
  .top-item b{font-weight:500;color:var(--muted);text-align:right}

  /* providers */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .input{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:7px 10px;border-radius:9px;font-size:12.5px;min-width:180px}
  .input:focus{outline:none;border-color:#2f4a57}
  select.input{min-width:130px}
  .tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.4px;background:rgba(255,255,255,.015)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .name{display:flex;align-items:center;gap:8px;min-width:190px}
  .name b{font-weight:600}
  .name span{color:var(--dim);font-size:11px}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10.5px;color:var(--muted);margin-right:4px}
  .tag.tools{color:#a7f3d0;border-color:#1f5c4d;background:rgba(52,211,153,.08)}
  .tag.chat{color:#bae6fd;border-color:#1e4b63;background:rgba(34,211,238,.08)}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px}
  .st.closed{color:var(--green)} .st.open{color:var(--red)} .st.half{color:var(--amber)}
  .bar-lat{height:6px;border-radius:4px;background:#1a2330;overflow:hidden;min-width:70px}
  .bar-lat i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}
  .err{color:#fca5a5;font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--muted)} .dim{color:var(--dim)}

  /* logs */
  .logs{max-height:420px;overflow:auto}
  .logline{display:grid;grid-template-columns:64px 54px 1fr 92px 62px;gap:8px;padding:7px 12px;
    border-bottom:1px solid var(--line);font-size:12px;align-items:center}
  .logline:last-child{border-bottom:0}
  .logline .t{color:var(--dim)}
  .ev{font-size:10.5px;padding:1px 6px;border-radius:6px;text-align:center;border:1px solid var(--line);color:var(--muted)}
  .ev.ok{color:#a7f3d0;border-color:#1f5c4d;background:rgba(52,211,153,.07)}
  .ev.fail,.ev.relay_error{color:#fecaca;border-color:#5b2020;background:rgba(248,113,113,.07)}
  .logline .p{color:var(--muted);text-align:right}
  .logline .m{color:var(--dim);text-align:right}
  .logline .api{color:var(--dim);font-size:10.5px}
  .empty{padding:22px;text-align:center;color:var(--dim);font-size:12.5px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:70}
  .toast.show{opacity:1}

  @media (max-width:1080px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .pools{grid-template-columns:1fr}
    .usage{grid-template-columns:1fr}
  }
  @media (max-width:720px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .pool-body{grid-template-columns:80px 1fr}
    .logline{grid-template-columns:56px 48px 1fr 52px}
    .logline .p{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo">
      <div class="mark">FT</div>
      <div>Free Token Cloud<small>RELAY CONSOLE · 101</small></div>
    </div>
    <div class="spacer"></div>
    <div class="pill live" id="statusPill"><i class="dot" id="statusDot"></i><span id="statusText">加载中…</span></div>
    <div class="pill mono" id="uptime">uptime —</div>
    <button class="btn" id="refreshBtn">刷新</button>
  </div>
</header>

<main class="wrap">
  <div class="grid stats">
    <div class="card"><h3>总请求</h3><div class="big" id="sReq">—</div><div class="sub" id="sReqSub">失败 —</div></div>
    <div class="card"><h3>成功率</h3><div class="big" id="sOk">—</div><div class="sub" id="sOkSub">—</div><svg class="spark" id="sparkOk" viewBox="0 0 100 30" preserveAspectRatio="none"></svg></div>
    <div class="card"><h3>平均延迟</h3><div class="big" id="sLat">—</div><div class="sub">最近成功请求</div></div>
    <div class="card"><h3>可用槽位</h3><div class="big" id="sSlots">—</div><div class="sub">熔断中 <b id="sOpen">0</b></div></div>
    <div class="card"><h3>流式请求</h3><div class="big" id="sStream">—</div><div class="sub">SSE 计数</div></div>
  </div>

  <section class="section">
    <div class="sec-head"><h2>双池</h2><span class="hint">tools 走工具链，chat 只对话；两池共用熔断与冷却</span></div>
    <div class="grid pools">
      <div class="card pool-card" id="poolTools"></div>
      <div class="card pool-card chat" id="poolChat"></div>
    </div>
  </section>

  <section class="section">
    <div class="sec-head"><h2>用量</h2><span class="hint">最近 30 分钟 · 按池与接口拆分</span><div class="spacer"></div>
      <div class="legend">
        <span><i style="background:var(--green)"></i>tools</span>
        <span><i style="background:var(--cyan)"></i>chat</span>
        <span><i style="background:var(--red)"></i>失败</span>
      </div>
    </div>
    <div class="grid usage">
      <div class="card"><svg id="usageChart" viewBox="0 0 900 160" preserveAspectRatio="none"></svg></div>
      <div class="card api-split" id="apiSplit"></div>
    </div>
  </section>

  <section class="section">
    <div class="sec-head">
      <h2>上游槽位</h2><span class="hint" id="provCount"></span>
      <div class="spacer"></div>
      <div class="toolbar">
        <input class="input" id="search" placeholder="搜索 id / label">
        <select class="input" id="poolFilter">
          <option value="">全部池</option><option value="tools">tools</option><option value="chat">chat</option>
        </select>
        <select class="input" id="stateFilter">
          <option value="">全部状态</option><option value="closed">正常</option><option value="open">熔断</option><option value="half">半开</option>
        </select>
      </div>
    </div>
    <div class="tbl">
      <table>
        <thead><tr><th>槽位</th><th>池</th><th>状态</th><th>成功 / 失败</th><th>平均延迟</th><th>最近错误</th></tr></thead>
        <tbody id="provBody"></tbody>
      </table>
    </div>
  </section>

  <section class="section">
    <div class="sec-head"><h2>实时日志</h2><span class="hint">最近 100 条 · R=Responses C=Chat</span><div class="spacer"></div><span class="pill" id="logCount">—</span></div>
    <div class="tbl logs" id="logsBox"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  var state = { providers: [], pools: {}, logs: [], metrics: null, health: null, timer: null };
  var $ = function(id){ return document.getElementById(id); };

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function h(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }
  function fmtMs(ms){ if(ms == null) return '—'; return ms >= 1000 ? (ms/1000).toFixed(1)+'s' : Math.round(ms)+'ms'; }
  function fmtNum(n){ if(n == null) return '—'; if(n >= 1000000) return (n/1000000).toFixed(1)+'M'; if(n >= 1000) return (n/1000).toFixed(1)+'k'; return String(n); }
  function ago(iso){
    if(!iso) return '—';
    var d = Date.now() - new Date(iso).getTime();
    if(d < 0) d = 0;
    if(d < 60000) return Math.round(d/1000)+'s 前';
    if(d < 3600000) return Math.round(d/60000)+'m 前';
    return Math.round(d/3600000)+'h 前';
  }
  function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
  function providerOf(id){ return state.providers.filter(function(p){ return p.id === id; })[0]; }

  function renderStats(){
    var m = (state.metrics && state.metrics.metrics) || {};
    var req = m.requests || 0, ok = m.successes || 0;
    $('sReq').textContent = fmtNum(req);
    $('sReqSub').textContent = '失败 ' + fmtNum(m.failures || 0);
    $('sOk').textContent = req ? pct(ok, req) + '%' : '—';
    $('sOkSub').textContent = ok + ' / ' + req;
    var oks = state.logs.filter(function(l){ return l.ev === 'ok'; }).slice(-100);
    var lat = oks.length ? Math.round(oks.reduce(function(a,b){ return a + (b.ms||0); },0)/oks.length) : null;
    $('sLat').textContent = lat == null ? '—' : fmtMs(lat);
    var total = state.providers.length;
    var open = state.providers.filter(function(p){ return p.circuit === 'open'; }).length;
    $('sSlots').textContent = (total - open) + '/' + total;
    $('sOpen').textContent = open;
    $('sStream').textContent = fmtNum(m.streams || 0);
    var upt = (state.health && state.health.uptime_s) || 0;
    $('uptime').textContent = 'uptime ' + (upt >= 86400 ? (upt/86400).toFixed(1)+'d' : upt >= 3600 ? (upt/3600).toFixed(1)+'h' : Math.round(upt/60)+'m');

    $('statusDot').className = 'dot ' + (state.health && state.health.ok ? 'ok' : 'bad');
    $('statusText').textContent = state.health && state.health.ok ? '服务正常' : '上游不可用';
  }

  function renderSpark(){
    var svg = $('sparkOk');
    var oks = state.logs.filter(function(l){ return l.ev === 'ok'; }).slice(-40);
    if(!oks.length){ svg.innerHTML = ''; return; }
    var max = Math.max.apply(null, oks.map(function(l){ return l.ms || 1; }));
    var step = 100 / Math.max(1, oks.length - 1);
    var pts = oks.map(function(l, i){
      var y = 28 - Math.min(26, (l.ms || 0) / max * 26);
      return (i*step).toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    svg.innerHTML = '<polyline fill="none" stroke="#2dd4bf" stroke-width="1.6" points="' + pts + '"/>';
  }

  function poolStats(name){
    var members = state.pools[name] || [];
    var list = members.map(providerOf).filter(Boolean);
    var open = list.filter(function(p){ return p.circuit === 'open'; }).length;
    var lat = list.filter(function(p){ return p.avg_latency_ms; });
    var avg = lat.length ? Math.round(lat.reduce(function(a,b){ return a + b.avg_latency_ms; },0)/lat.length) : null;
    var rows = state.logs.filter(function(l){ return l.model === name; });
    var ok = rows.filter(function(l){ return l.ev === 'ok'; }).length;
    var fail = rows.filter(function(l){ return l.ev === 'fail' || l.ev === 'relay_error'; }).length;
    var current = list.filter(function(p){ return p.circuit !== 'open'; })[0] || null;
    return { name: name, members: members, list: list, open: open, avg: avg, ok: ok, fail: fail, current: current, requests: rows.length };
  }

  function gauge(value, color){
    var r = 40, c = 2 * Math.PI * r;
    var off = c * (1 - Math.max(0, Math.min(1, value / 100)));
    return '<div class="gauge"><svg width="96" height="96" viewBox="0 0 96 96">' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="#172130" stroke-width="8"/>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '</svg><div class="val"><div><b>' + value + '%</b><span>成功率</span></div></div></div>';
  }

  function poolCard(s, color, customClass){
    var rate = pct(s.ok, s.ok + s.fail);
    var chips = s.list.map(function(p){
      var cls = p.circuit === 'open' ? 'bad' : p.circuit === 'half-open' ? 'warn' : 'ok';
      var hot = s.current && s.current.id === p.id ? ' hot' : '';
      return '<span class="member' + hot + '"><i class="dot ' + cls + '"></i>' + h(p.id) + '</span>';
    }).join('') || '<span class="dim">无成员</span>';
    var route = s.current ? s.current.id : '无可用上游';
    return '<div class="pool-top"><div><div class="pool-title">POOL</div><div class="pool-name">' + h(s.name) + '</div></div>' +
      '<span class="pool-badge">' + s.members.length + ' 成员</span></div>' +
      '<div class="pool-body">' + gauge(rate, color) +
      '<div class="kv">' +
        '<div><span>可用</span><b>' + (s.members.length - s.open) + ' / ' + s.members.length + '</b></div>' +
        '<div><span>请求（日志窗口）</span><b>' + s.requests + '</b></div>' +
        '<div><span>成功 / 失败</span><b>' + s.ok + ' / ' + s.fail + '</b></div>' +
        '<div><span>平均延迟</span><b>' + fmtMs(s.avg) + '</b></div>' +
      '</div></div>' +
      '<div class="route"><span class="live-dot"></span>当前选定 API：<b>' + h(route) + '</b></div>' +
      '<div class="members">' + chips + '</div>';
  }

  function renderPools(){
    var tools = poolStats('tools');
    var chat = poolStats('chat');
    $('poolTools').innerHTML = poolCard(tools, '#34d399');
    $('poolChat').innerHTML = poolCard(chat, '#22d3ee');
  }

  function renderUsage(){
    var svg = $('usageChart');
    var now = Date.now();
    var buckets = [];
    for(var i = 29; i >= 0; i--){ buckets.push({ tools: 0, chat: 0, fail: 0 }); }
    state.logs.forEach(function(l){
      var idx = 29 - Math.floor((now - new Date(l.ts).getTime()) / 60000);
      if(idx < 0 || idx > 29) return;
      if(l.ev === 'fail' || l.ev === 'relay_error'){ buckets[idx].fail++; return; }
      if(l.ev !== 'ok') return;
      if(l.model === 'tools') buckets[idx].tools++;
      else buckets[idx].chat++;
    });
    var max = 1;
    buckets.forEach(function(b){ max = Math.max(max, b.tools + b.chat + b.fail); });
    var bw = 900 / 30, out = '';
    buckets.forEach(function(b, i){
      var x = i * bw + 3, w = bw - 6, base = 150;
      var hTools = b.tools / max * 130;
      var hChat = b.chat / max * 130;
      var hFail = b.fail / max * 130;
      if(!b.tools && !b.chat && !b.fail){
        out += '<rect x="'+x+'" y="'+(base-2)+'" width="'+w+'" height="2" rx="1" fill="#1b2533"/>';
        return;
      }
      var y = base;
      if(hFail){ y -= hFail; out += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hFail+'" rx="2" fill="#f87171" opacity=".7"/>'; }
      if(hTools){ y -= hTools; out += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hTools+'" rx="2" fill="#34d399" opacity=".9"/>'; }
      if(hChat){ y -= hChat; out += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hChat+'" rx="2" fill="#22d3ee" opacity=".9"/>'; }
    });
    out += '<line x1="0" y1="151" x2="900" y2="151" stroke="#1c2634" stroke-width="1"/>';
    svg.innerHTML = out;

    var totals = { tools: 0, chat: 0, responses: 0, chatapi: 0 };
    state.logs.forEach(function(l){
      if(l.ev === 'ok'){
        if(l.model === 'tools') totals.tools++; else totals.chat++;
        if(l.api === 'responses') totals.responses++; else totals.chatapi++;
      }
    });
    var top = state.providers.slice().sort(function(a,b){ return (b.successes||0) - (a.successes||0); }).slice(0, 6);
    var maxTop = Math.max.apply(null, top.map(function(p){ return p.successes || 1; }).concat([1]));
    var apiTotal = totals.responses + totals.chatapi || 1;
    $('apiSplit').innerHTML =
      '<div><div class="pool-title">调用接口</div>' +
        '<div class="api-row"><span class="mono">/v1/responses</span><div class="bar"><i style="width:' + pct(totals.responses, apiTotal) + '%"></i></div><span class="n">' + totals.responses + '</span></div>' +
        '<div class="api-row"><span class="mono">/v1/chat</span><div class="bar"><i style="width:' + pct(totals.chatapi, apiTotal) + '%"></i></div><span class="n">' + totals.chatapi + '</span></div>' +
      '</div>' +
      '<div><div class="pool-title" style="margin-top:14px">上游成功数 TOP</div><div class="top-list">' +
        top.map(function(p){
          return '<div class="top-item"><span class="mono">' + h(p.id) + '</span>' +
            '<div class="bar"><i style="width:' + Math.max(3, Math.round((p.successes||0)/maxTop*100)) + '%"></i></div>' +
            '<b>' + (p.successes||0) + '</b></div>';
        }).join('') +
      '</div></div>';
  }

  function circuitLabel(p){
    if(p.circuit === 'open') return { cls:'open', text:'熔断' };
    if(p.circuit === 'half-open') return { cls:'half', text:'半开' };
    return { cls:'closed', text:'正常' };
  }

  function renderProviders(){
    var q = ($('search').value || '').toLowerCase();
    var pool = $('poolFilter').value;
    var st = $('stateFilter').value;
    var list = state.providers.filter(function(p){
      if(q && (p.id + ' ' + (p.label||'')).toLowerCase().indexOf(q) < 0) return false;
      if(pool && (p.pools||[]).indexOf(pool) < 0) return false;
      var c = circuitLabel(p);
      if(st === 'open' && c.cls !== 'open') return false;
      if(st === 'half' && c.cls !== 'half') return false;
      if(st === 'closed' && c.cls !== 'closed') return false;
      return true;
    });
    $('provCount').textContent = list.length + ' / ' + state.providers.length + ' 个槽位';
    var maxLat = Math.max.apply(null, list.map(function(p){ return p.avg_latency_ms || 0; }).concat([1]));
    $('provBody').innerHTML = list.map(function(p){
      var c = circuitLabel(p);
      var lat = p.avg_latency_ms;
      var barW = lat ? Math.max(4, Math.round(lat / maxLat * 100)) : 0;
      var tags = (p.pools||[]).map(function(x){ return '<span class="tag ' + x + '">' + h(x) + '</span>'; }).join('');
      var err = p.last_error_code ? '<span class="err">' + h(p.last_error_code) + '</span>' : '<span class="dim">—</span>';
      return '<tr>' +
        '<td><div class="name"><b>' + h(p.id) + '</b><span>' + h(p.label||'') + '</span></div></td>' +
        '<td>' + tags + '</td>' +
        '<td><span class="st ' + c.cls + '"><i class="dot ' + (c.cls==='closed'?'ok':c.cls==='open'?'bad':'warn') + '"></i>' + c.text + (p.retry_at ? ' · ' + h(ago(p.retry_at)) : '') + '</span></td>' +
        '<td class="mono">' + (p.successes||0) + ' / ' + (p.failures||0) + '</td>' +
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar-lat"><i style="width:' + barW + '%"></i></div><span class="mono dim">' + fmtMs(lat) + '</span></div></td>' +
        '<td>' + err + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="6" class="empty">没有匹配的槽位</td></tr>';
  }

  function renderLogs(){
    var logs = state.logs.slice(-100).reverse();
    $('logCount').textContent = logs.length + ' 条';
    if(!logs.length){ $('logsBox').innerHTML = '<div class="empty">暂无日志</div>'; return; }
    $('logsBox').innerHTML = logs.map(function(l){
      var t = (l.ts || '').slice(11, 19);
      var ev = l.ev || '?';
      var cls = ev === 'ok' ? 'ok' : (ev === 'fail' || ev === 'relay_error') ? 'fail' : '';
      var model = l.model || l.provider || '';
      var detail = l.provider && l.model ? l.provider : (l.provider || '');
      var api = l.api === 'responses' ? 'R' : 'C';
      return '<div class="logline">' +
        '<span class="t mono">' + h(t) + '</span>' +
        '<span class="ev ' + cls + '">' + h(ev) + '</span>' +
        '<span><span class="mono">' + h(model) + '</span> <span class="api">' + api + '</span></span>' +
        '<span class="p mono">' + h(detail) + '</span>' +
        '<span class="m mono">' + (l.ms != null ? l.ms + 'ms' : '—') + '</span>' +
      '</div>';
    }).join('');
  }

  function load(){
    return fetch('/api/public', { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      state.health = { ok: d.ok, uptime_s: d.uptime_s };
      state.providers = d.providers || [];
      state.pools = d.pools || {};
      state.logs = d.logs || [];
      state.metrics = { metrics: d.metrics || {} };
      renderStats(); renderSpark(); renderPools(); renderUsage(); renderProviders(); renderLogs();
    }).catch(function(err){
      $('statusDot').className = 'dot bad';
      $('statusText').textContent = '刷新失败';
      toast('刷新失败：' + err.message);
    });
  }

  function start(){
    load();
    if(state.timer) clearInterval(state.timer);
    state.timer = setInterval(load, 5000);
  }

  $('refreshBtn').addEventListener('click', function(){ load(); toast('已刷新'); });
  ['search','poolFilter','stateFilter'].forEach(function(id){
    $(id).addEventListener('input', renderProviders);
    $(id).addEventListener('change', renderProviders);
  });

  start();
})();
</script>
</body>
</html>
