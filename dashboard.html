<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Token Cloud · Relay Console</title>
<style>
  :root{
    --bg:#070a0f; --panel:#0d1219; --panel-2:#111823; --line:#1c2634;
    --ink:#e8eef7; --muted:#8593a6; --dim:#5d6b7d;
    --teal:#2dd4bf; --cyan:#22d3ee; --amber:#fbbf24; --red:#f87171; --green:#34d399;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(900px 500px at 12% -8%, rgba(45,212,191,.13), transparent 60%),
      radial-gradient(700px 420px at 92% 0%, rgba(34,211,238,.10), transparent 55%),
      var(--bg);
    color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  a{color:var(--teal);text-decoration:none}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1280px;margin:0 auto;padding:0 22px}

  /* header */
  header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
    background:rgba(7,10,15,.78);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:16px;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--cyan));
    display:grid;place-items:center;color:#04231f;font-weight:900;font-size:14px}
  .logo small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.6px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);padding:6px 11px;border-radius:999px;font-size:12px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.14)}
  .dot.bad{background:var(--red);box-shadow:0 0 0 4px rgba(248,113,113,.14)}
  .dot.warn{background:var(--amber);box-shadow:0 0 0 4px rgba(251,191,36,.14)}
  .live .dot.ok{animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    padding:7px 12px;border-radius:10px;font-size:12px}
  .btn:hover{border-color:#2c3a4d}
  .btn.primary{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#04231f;border:0;font-weight:700}
  .btn.ghost{background:transparent}

  /* layout */
  main{padding:22px 0 60px}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(5,1fr)}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)),var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px}
  .card h3{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.4px}
  .big{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .big small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .spark{width:100%;height:34px;display:block;margin-top:8px}

  .section{margin-top:20px}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 0 10px}
  .sec-head h2{margin:0;font-size:15px;letter-spacing:.3px}
  .sec-head .hint{color:var(--dim);font-size:12px}
  .sec-head .spacer{flex:1}

  .chart-card{padding:16px}
  .chart-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
  #traffic{width:100%;height:150px;display:block}

  /* providers */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .input{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:7px 10px;border-radius:9px;font-size:12.5px;min-width:180px}
  .input:focus{outline:none;border-color:#2f4a57}
  select.input{min-width:130px}
  .tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
  th{color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.4px;background:rgba(255,255,255,.015)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .name{display:flex;align-items:center;gap:8px;min-width:190px}
  .name b{font-weight:600}
  .name span{color:var(--dim);font-size:11px}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10.5px;color:var(--muted);margin-right:4px}
  .tag.tools{color:#a7f3d0;border-color:#1f5c4d;background:rgba(52,211,153,.08)}
  .tag.chat{color:#bae6fd;border-color:#1e4b63;background:rgba(34,211,238,.08)}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px}
  .st.closed{color:var(--green)} .st.open{color:var(--red)} .st.half{color:var(--amber)}
  .bar{height:6px;border-radius:4px;background:#1a2330;overflow:hidden;min-width:70px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}
  .err{color:#fca5a5;font-size:11px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--muted)} .dim{color:var(--dim)}

  /* pools */
  .pools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pool{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
  .pool.tools{color:#a7f3d0;border-color:#1f5c4d}
  .pool.chat{color:#bae6fd;border-color:#1e4b63}

  /* logs + playground */
  .split{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
  .logs{max-height:360px;overflow:auto}
  .logline{display:grid;grid-template-columns:64px 54px 1fr 92px 62px;gap:8px;padding:7px 12px;
    border-bottom:1px solid var(--line);font-size:12px;align-items:center}
  .logline:last-child{border-bottom:0}
  .logline .t{color:var(--dim)}
  .ev{font-size:10.5px;padding:1px 6px;border-radius:6px;text-align:center;border:1px solid var(--line);color:var(--muted)}
  .ev.ok{color:#a7f3d0;border-color:#1f5c4d;background:rgba(52,211,153,.07)}
  .ev.fail,.ev.relay_error{color:#fecaca;border-color:#5b2020;background:rgba(248,113,113,.07)}
  .logline .p{color:var(--muted);text-align:right}
  .logline .m{color:var(--dim);text-align:right}
  .logline .api{color:var(--dim);font-size:10.5px}
  .empty{padding:22px;text-align:center;color:var(--dim);font-size:12.5px}

  .pg textarea{width:100%;min-height:78px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:10px;font-size:13px;line-height:1.5}
  .pg textarea:focus{outline:none;border-color:#2f4a57}
  .pg .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  .out{margin-top:10px;background:#080d13;border:1px solid var(--line);border-radius:10px;padding:10px;
    min-height:90px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12.5px;color:#d7e3f4}
  .out .meta{color:var(--dim);font-size:11px;display:block;margin-bottom:6px}

  /* login */
  .overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    background:radial-gradient(600px 400px at 50% 20%,rgba(45,212,191,.12),transparent 60%),rgba(5,8,12,.92)}
  .login{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .login h1{margin:0 0 6px;font-size:19px}
  .login p{margin:0 0 16px;color:var(--muted);font-size:13px}
  .login input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:14px;letter-spacing:.3px}
  .login input:focus{outline:none;border-color:#2f4a57}
  .login .err{color:#fca5a5;font-size:12px;margin-top:8px;min-height:16px;max-width:none;white-space:normal}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:70}
  .toast.show{opacity:1}

  @media (max-width:1080px){.stats{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}}
  @media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.logline{grid-template-columns:56px 48px 1fr 52px}.logline .p{display:none}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo">
      <div class="mark">FT</div>
      <div>Free Token Cloud<small>RELAY CONSOLE · 101</small></div>
    </div>
    <div class="spacer"></div>
    <div class="pill live" id="statusPill"><i class="dot" id="statusDot"></i><span id="statusText">连接中…</span></div>
    <div class="pill mono" id="uptime">uptime —</div>
    <button class="btn ghost" id="refreshBtn">刷新</button>
  </div>
</header>

<main class="wrap">
  <div class="grid stats" id="statCards">
    <div class="card"><h3>总请求</h3><div class="big" id="sReq">—</div><div class="sub" id="sReqSub">自上次重启</div></div>
    <div class="card"><h3>成功率</h3><div class="big" id="sOk">—</div><div class="sub" id="sOkSub">成功 / 总数</div><svg class="spark" id="sparkOk" viewBox="0 0 100 30" preserveAspectRatio="none"></svg></div>
    <div class="card"><h3>平均延迟</h3><div class="big" id="sLat">—</div><div class="sub">最近 100 条成功请求</div></div>
    <div class="card"><h3>可用槽位</h3><div class="big" id="sSlots">—</div><div class="sub" id="sSlotsSub">熔断中 <b id="sOpen">0</b></div></div>
    <div class="card"><h3>流式请求</h3><div class="big" id="sStream">—</div><div class="sub">SSE 计数</div></div>
  </div>

  <section class="section">
    <div class="card chart-card">
      <div class="chart-top">
        <div>
          <div class="sec-head" style="margin:0"><h2>最近 30 分钟流量</h2><span class="hint">按分钟聚合 · 成功 / 失败</span></div>
        </div>
        <div class="legend">
          <span><i style="background:var(--teal)"></i>成功</span>
          <span><i style="background:var(--red)"></i>失败</span>
          <span><i style="background:#243244"></i>空窗</span>
        </div>
      </div>
      <svg id="traffic" viewBox="0 0 900 150" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="section">
    <div class="sec-head">
      <h2>上游槽位</h2>
      <span class="hint" id="provCount"></span>
      <div class="spacer"></div>
      <div class="toolbar">
        <input class="input" id="search" placeholder="搜索 id / label">
        <select class="input" id="poolFilter">
          <option value="">全部池</option>
          <option value="tools">tools</option>
          <option value="chat">chat</option>
        </select>
        <select class="input" id="stateFilter">
          <option value="">全部状态</option>
          <option value="closed">正常</option>
          <option value="open">熔断</option>
          <option value="half">半开</option>
          <option value="disabled">禁用</option>
        </select>
      </div>
    </div>
    <div class="tbl">
      <table>
        <thead>
          <tr><th>槽位</th><th>池</th><th>状态</th><th>成功 / 失败</th><th>平均延迟</th><th>最近错误</th></tr>
        </thead>
        <tbody id="provBody"></tbody>
      </table>
    </div>
    <div class="pools" id="poolChips"></div>
  </section>

  <section class="section split">
    <div>
      <div class="sec-head"><h2>实时日志</h2><span class="hint">最近 100 条</span><div class="spacer"></div><span class="pill" id="logCount">—</span></div>
      <div class="tbl logs" id="logsBox"></div>
    </div>
    <div class="card pg">
      <div class="sec-head" style="margin:0 0 8px"><h2>试一条</h2><span class="hint">走同一套池与熔断</span></div>
      <div class="row" style="margin:0 0 8px">
        <select class="input" id="pgModel"><option>chat</option><option>tools</option></select>
        <input class="input" id="pgToken" type="password" placeholder="token（试跑用）" style="min-width:150px" autocomplete="off">
        <button class="btn primary" id="pgSend">发送</button>
        <button class="btn ghost" id="pgClear">清空</button>
      </div>
      <textarea id="pgPrompt" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）">用一句话说明你是什么模型</textarea>
      <div class="out" id="pgOut"><span class="meta">输出会显示在这里 · 流式</span></div>
    </div>
  </section>

  <section class="section">
    <div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:260px">
        <h3 style="margin:0 0 4px">给你的 agent 接上</h3>
        <div class="dim" style="font-size:12px">OpenAI 兼容入口 · 两个模型：<span class="mono">tools</span> / <span class="mono">chat</span></div>
      </div>
      <code class="mono" id="curlSnippet" style="font-size:12px;color:#cfe9e4;background:#080d13;border:1px solid var(--line);padding:9px 12px;border-radius:10px;max-width:100%;overflow:auto"></code>
      <button class="btn" id="copyCurl">复制</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  var STORE = 'relay_pg_token';
  var state = { providers: [], pools: {}, logs: [], metrics: null, health: null, timer: null };
  var $ = function(id){ return document.getElementById(id); };

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function h(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }
  function fmtMs(ms){ if(ms == null) return '—'; return ms >= 1000 ? (ms/1000).toFixed(1)+'s' : Math.round(ms)+'ms'; }
  function fmtNum(n){ if(n == null) return '—'; if(n >= 1000000) return (n/1000000).toFixed(1)+'M'; if(n >= 1000) return (n/1000).toFixed(1)+'k'; return String(n); }
  function ago(iso){
    if(!iso) return '—';
    var d = Date.now() - new Date(iso).getTime();
    if(d < 0) d = 0;
    if(d < 60000) return Math.round(d/1000)+'s 前';
    if(d < 3600000) return Math.round(d/60000)+'m 前';
    return Math.round(d/3600000)+'h 前';
  }

  function renderStats(){
    var m = (state.metrics && state.metrics.metrics) || {};
    var req = m.requests || 0, ok = m.successes || 0;
    $('sReq').textContent = fmtNum(req);
    $('sReqSub').textContent = '失败 ' + fmtNum(m.failures || 0);
    var rate = req ? (ok / req * 100) : 0;
    $('sOk').textContent = req ? rate.toFixed(1) + '%' : '—';
    $('sOkSub').textContent = ok + ' / ' + req;
    var oks = state.logs.filter(function(l){ return l.ev === 'ok'; }).slice(-100);
    var lat = oks.length ? Math.round(oks.reduce(function(a,b){ return a + (b.ms||0); },0)/oks.length) : null;
    $('sLat').textContent = lat == null ? '—' : fmtMs(lat);
    var total = state.providers.filter(function(p){ return p.enabled !== false; }).length;
    var open = state.providers.filter(function(p){ return p.enabled !== false && p.circuit === 'open'; }).length;
    $('sSlots').textContent = (total - open) + '/' + total;
    $('sOpen').textContent = open;
    $('sStream').textContent = fmtNum(m.streams || 0);
    var upt = (state.health && state.health.uptime_s) || 0;
    $('uptime').textContent = 'uptime ' + (upt >= 86400 ? (upt/86400).toFixed(1)+'d' : upt >= 3600 ? (upt/3600).toFixed(1)+'h' : Math.round(upt/60)+'m');

    var okDot = $('statusDot');
    var healthy = state.health && state.health.ok;
    okDot.className = 'dot ' + (healthy ? 'ok' : 'bad');
    $('statusText').textContent = healthy ? '服务正常' : '上游不可用';
  }

  function renderSpark(){
    var svg = $('sparkOk');
    var oks = state.logs.filter(function(l){ return l.ev === 'ok'; }).slice(-40);
    if(!oks.length){ svg.innerHTML = ''; return; }
    var max = Math.max.apply(null, oks.map(function(l){ return l.ms || 1; }));
    var step = 100 / Math.max(1, oks.length - 1);
    var pts = oks.map(function(l, i){
      var y = 28 - Math.min(26, (l.ms || 0) / max * 26);
      return (i*step).toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    svg.innerHTML = '<polyline fill="none" stroke="#2dd4bf" stroke-width="1.6" points="' + pts + '"/>';
  }

  function renderTraffic(){
    var svg = $('traffic');
    var now = Date.now();
    var buckets = [];
    for(var i = 29; i >= 0; i--){
      buckets.push({ t: now - i*60000, ok: 0, fail: 0 });
    }
    state.logs.forEach(function(l){
      var ts = new Date(l.ts).getTime();
      var idx = 29 - Math.floor((now - ts) / 60000);
      if(idx < 0 || idx > 29) return;
      if(l.ev === 'ok') buckets[idx].ok++;
      else if(l.ev === 'fail' || l.ev === 'relay_error') buckets[idx].fail++;
    });
    var max = 1;
    buckets.forEach(function(b){ max = Math.max(max, b.ok + b.fail); });
    var bw = 900 / 30;
    var out = '';
    buckets.forEach(function(b, i){
      var x = i * bw + 3;
      var w = bw - 6;
      var totalH = (b.ok + b.fail) / max * 130;
      var okH = b.ok / max * 130;
      var base = 145;
      if(b.ok + b.fail === 0){
        out += '<rect x="'+x+'" y="'+(base-2)+'" width="'+w+'" height="2" rx="1" fill="#1b2533"/>';
      } else {
        out += '<rect x="'+x+'" y="'+(base-totalH)+'" width="'+w+'" height="'+Math.max(1,totalH)+'" rx="2" fill="#f87171" opacity=".55"/>';
        out += '<rect x="'+x+'" y="'+(base-okH)+'" width="'+w+'" height="'+Math.max(1,okH)+'" rx="2" fill="#2dd4bf" opacity=".9"/>';
      }
    });
    out += '<line x1="0" y1="146" x2="900" y2="146" stroke="#1c2634" stroke-width="1"/>';
    svg.innerHTML = out;
  }

  function circuitLabel(p){
    if(p.enabled === false) return { cls:'open', text:'禁用' };
    if(p.circuit === 'open') return { cls:'open', text:'熔断' };
    if(p.circuit === 'half-open') return { cls:'half', text:'半开' };
    return { cls:'closed', text:'正常' };
  }

  function renderProviders(){
    var q = ($('search').value || '').toLowerCase();
    var pool = $('poolFilter').value;
    var st = $('stateFilter').value;
    var list = state.providers.filter(function(p){
      if(q && (p.id + ' ' + (p.label||'')).toLowerCase().indexOf(q) < 0) return false;
      if(pool && (p.pools||[]).indexOf(pool) < 0) return false;
      var c = circuitLabel(p);
      if(st === 'disabled' && p.enabled !== false) return false;
      if(st && st !== 'disabled'){
        if(st === 'open' && c.cls !== 'open') return false;
        if(st === 'half' && c.cls !== 'half') return false;
        if(st === 'closed' && c.cls !== 'closed') return false;
      }
      return true;
    });
    $('provCount').textContent = list.length + ' / ' + state.providers.length + ' 个槽位';
    var maxLat = Math.max.apply(null, list.map(function(p){ return p.avg_latency_ms || 0; }).concat([1]));
    $('provBody').innerHTML = list.map(function(p){
      var c = circuitLabel(p);
      var lat = p.avg_latency_ms;
      var barW = lat ? Math.max(4, Math.round(lat / maxLat * 100)) : 0;
      var tags = (p.pools||[]).map(function(x){ return '<span class="tag ' + x + '">' + h(x) + '</span>'; }).join('');
      var err = p.last_error_code ? '<span class="err">' + h(p.last_error_code) + '</span>' : '<span class="dim">—</span>';
      return '<tr>' +
        '<td><div class="name"><b>' + h(p.id) + '</b><span>' + h(p.label||'') + '</span></div></td>' +
        '<td>' + tags + '</td>' +
        '<td><span class="st ' + c.cls + '"><i class="dot ' + (c.cls==='closed'?'ok':c.cls==='open'?'bad':'warn') + '"></i>' + c.text + (p.retry_at ? ' · ' + h(ago(p.retry_at)) : '') + '</span></td>' +
        '<td class="mono">' + (p.successes||0) + ' / ' + (p.failures||0) + '</td>' +
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:' + barW + '%"></i></div><span class="mono dim">' + fmtMs(lat) + '</span></div></td>' +
        '<td>' + err + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="6" class="empty">没有匹配的槽位</td></tr>';

    var pools = state.pools || {};
    $('poolChips').innerHTML = Object.keys(pools).map(function(name){
      return '<span class="pool ' + name + '">' + h(name) + ' · ' + pools[name].length + '</span>';
    }).join('');
  }

  function renderLogs(){
    var logs = state.logs.slice(-100).reverse();
    $('logCount').textContent = logs.length + ' 条';
    if(!logs.length){ $('logsBox').innerHTML = '<div class="empty">暂无日志</div>'; return; }
    $('logsBox').innerHTML = logs.map(function(l){
      var t = (l.ts || '').slice(11, 19);
      var ev = l.ev || '?';
      var cls = ev === 'ok' ? 'ok' : (ev === 'fail' || ev === 'relay_error') ? 'fail' : '';
      var model = l.model || l.provider || '';
      var detail = l.provider && l.model ? l.provider : (l.provider || '');
      var api = l.api === 'responses' ? 'R' : 'C';
      return '<div class="logline">' +
        '<span class="t mono">' + h(t) + '</span>' +
        '<span class="ev ' + cls + '">' + h(ev) + '</span>' +
        '<span><span class="mono">' + h(model) + '</span> <span class="api">' + api + '</span></span>' +
        '<span class="p mono">' + h(detail) + '</span>' +
        '<span class="m mono">' + (l.ms != null ? l.ms + 'ms' : '—') + '</span>' +
      '</div>';
    }).join('');
  }

  function renderCurl(){
    var host = location.origin;
    var q = String.fromCharCode(39);
    var nl = String.fromCharCode(10);
    var body = '{"model":"chat","messages":[{"role":"user","content":"hi"}]}';
    $('curlSnippet').textContent =
      'curl ' + host + '/v1/chat/completions' + nl +
      '  -H "Authorization: Bearer <YOUR_TOKEN>"' + nl +
      '  -d ' + q + body + q;
  }

  function load(){
    return fetch('/api/public', { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      state.health = { ok: d.ok, uptime_s: d.uptime_s };
      state.providers = d.providers || [];
      state.pools = d.pools || {};
      state.logs = d.logs || [];
      state.metrics = { metrics: d.metrics || {} };
      renderStats(); renderSpark(); renderTraffic(); renderProviders(); renderLogs();
    }).catch(function(err){
      $('statusDot').className = 'dot bad';
      $('statusText').textContent = '刷新失败';
      toast('刷新失败：' + err.message + '（5s 后重试）');
    });
  }

  function start(){
    load();
    if(state.timer) clearInterval(state.timer);
    state.timer = setInterval(load, 5000);
  }

  $('refreshBtn').addEventListener('click', function(){ load(); toast('已刷新'); });
  ['search','poolFilter','stateFilter'].forEach(function(id){
    $(id).addEventListener('input', renderProviders);
    $(id).addEventListener('change', renderProviders);
  });
  $('copyCurl').addEventListener('click', function(){
    navigator.clipboard.writeText($('curlSnippet').textContent).then(function(){ toast('已复制'); });
  });

  /* playground */
  function pgCred(){
    var v = ($('pgToken').value || '').trim();
    if(v){ try { localStorage.setItem(STORE, v); } catch(e){} return v; }
    try { return localStorage.getItem(STORE) || ''; } catch(e){ return ''; }
  }
  function send(){
    var prompt = $('pgPrompt').value.trim();
    if(!prompt) return;
    var cred = pgCred();
    if(!cred){ toast('试跑需要填 token'); $('pgToken').focus(); return; }
    var NL = String.fromCharCode(10);
    var out = $('pgOut');
    out.textContent = '';
    var meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = 'model=' + $('pgModel').value + ' · 流式中…';
    out.appendChild(meta);
    fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'content-type':'application/json', authorization:'Bearer ' + cred },
      body: JSON.stringify({ model: $('pgModel').value, stream: true, messages: [{ role:'user', content: prompt }] })
    }).then(function(res){
      if(res.status === 401){ out.textContent = 'token 无效或已轮换'; return; }
      if(!res.ok) return res.text().then(function(t){ out.textContent = 'HTTP ' + res.status + ' - ' + t; });
      var reader = res.body.getReader(); var dec = new TextDecoder(); var buf = '';
      function pump(){
        return reader.read().then(function(r){
          if(r.done){ meta.textContent = '完成'; return; }
          buf += dec.decode(r.value, { stream: true });
          var parts = buf.split(NL + NL); buf = parts.pop();
          parts.forEach(function(part){
            var line = part.split(NL).filter(function(x){ return x.indexOf('data:') === 0; })[0];
            if(!line) return;
            var payload = line.slice(5).trim();
            if(payload === '[DONE]') return;
            try{
              var j = JSON.parse(payload);
              var d = j.choices && j.choices[0] && j.choices[0].delta;
              if(d && d.content){ out.appendChild(document.createTextNode(d.content)); out.scrollTop = out.scrollHeight; }
            }catch(e){}
          });
          return pump();
        });
      }
      return pump();
    }).catch(function(e){ out.textContent = '请求失败：' + e.message; });
  }
  $('pgSend').addEventListener('click', send);
  $('pgClear').addEventListener('click', function(){ $('pgOut').innerHTML = '<span class="meta">输出会显示在这里 · 流式</span>'; });
  $('pgPrompt').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $('pgToken').addEventListener('change', function(){ pgCred(); });

  start();
  renderCurl();
})();

</script>
</body>
</html>
