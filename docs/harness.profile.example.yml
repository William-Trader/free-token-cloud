# DSH Desktop（DeepSeek Harness）profile 补丁示例
# 用法：把本文件内容并进 profiles/web/cordis.patch.yml，密码只放环境变量。
# 服务器地址与 token 一律不要硬编码进仓库。
- id: agent-default-model
  config:
    provider: ai-relay
    model: tools

- id: llm-pi-ai
  config:
    providers:
      ai-relay:
        displayName: Free Token Cloud
        api: anthropic-messages
        baseURL: http://<RELAY_HOST>:8080
        apiKeyEnv: QSP_AI_TOKEN
        timeoutMs: 320000
        streamIdleTimeoutMs: 120000
        models:
          - id: tools
            name: AI Relay Tools
            contextWindow: 200000
            maxTokens: 8192
            input: [text]
            reasoningEfforts: false
          - id: chat
            name: AI Relay Chat
            contextWindow: 200000
            maxTokens: 8192
            input: [text]
            reasoningEfforts: false

- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
